# BOXBOXBOX na Mac mini (Docker Desktop)
#   1) cp .env.example .env   a doplň PS5_IP
#   2) docker compose up -d --build
#   3) dashboard: http://<IP Mac mini>:8099
#
# PS5 v Dockeru nejde najít broadcastem, proto je IP povinná.
# Port 33740/udp nesmí současně používat jiný program (GT7Dashboard, nativní Apexline).
services:
  boxboxbox:
    build: .
    image: boxboxbox:local
    container_name: boxboxbox
    restart: unless-stopped
    # --behind-nat: Docker Desktop přepisuje odesílatele paketů z PS5 na svou bránu
    command: ["--ps5", "${PS5_IP:?Doplň PS5_IP do souboru .env}", "--behind-nat"]
    ports:
      - "${DASHBOARD_PORT:-8099}:8080/tcp"
      - "33740:33740/udp"
    volumes:
      - ./telemetry-data:/data
    environment:
      - TZ=Europe/Prague
